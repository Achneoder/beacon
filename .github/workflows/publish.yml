name: publish images

# Builds and publishes the two deployable images to GitHub Container Registry.
#
# The desktop client is deliberately absent: it is packaged by hand, per OS
# (`pnpm --filter desktop dist`), and there is no image to build for it.
#
# CI (ci.yml) gates what reaches main; this workflow publishes what is already there.
# It is intentionally not chained to that run — a tag pushed to an already-green commit
# must be able to publish without re-running the e2e suites.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The only write this workflow needs: pushing to ghcr.io. GITHUB_TOKEN carries it.
      #
      # Visibility is a property of the *package*, not of this workflow: GHCR publishes
      # every new package private, whatever the repository's own visibility, and the
      # flip to public is a one-time manual step per package (and is irreversible).
      # There is no API or workflow input for it. See infra/DEPLOYMENT.md.
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            dockerfile: apps/api/Dockerfile
          - app: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          # metadata-action lowercases the image name, which ghcr.io requires and a
          # repository owner's display name does not guarantee.
          images: ghcr.io/${{ github.repository }}/${{ matrix.app }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          # The build context is the repository root for both images — the pnpm
          # workspace is the unit that installs.
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # amd64 only. An arm64 build works, but it would run the whole pnpm install
          # under QEMU; add `linux/arm64` here when there is a server that needs it.
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          # PUBLIC_API_URL is deliberately not passed: the web entrypoint writes
          # _app/env.js at container start, so one published image serves any
          # installation. This only sets the fallback for a container started without
          # the variable.
          build-args: |
            PUBLIC_API_URL=/api

# Throwaway backing services for the browser e2e suite (apps/web/tests).
#
# Separate project name and separate ports from infra/docker-compose.yml, so a running
# dev stack is never touched and never collides. Every volume is a tmpfs: the suite
# registers real organizations on every run and the data is meant to die with the
# container.
name: beacon-e2e

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: beacon
      POSTGRES_PASSWORD: beacon
      POSTGRES_DB: beacon_e2e
    ports:
      - '55432:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U beacon -d beacon_e2e']
      interval: 2s
      timeout: 3s
      retries: 30

  # StorageService connects on boot (it creates its bucket), so the API will not start
  # without an object store — even though no feature writes to it yet.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: beacon
      MINIO_ROOT_PASSWORD: beacon-secret
    ports:
      - '59000:9000'
      - '59001:9001'
    tmpfs:
      - /data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 2s
      timeout: 3s
      retries: 30

  # The search suite asserts that a document is findable, and that another person's is
  # not — which is only visible against a real engine, the same reason Mailpit is here
  # rather than a mocked MailService. Its data lives in a tmpfs like everything else.
  meilisearch:
    image: getmeili/meilisearch:v1.13
    environment:
      MEILI_MASTER_KEY: beacon-search-key
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: 'true'
    ports:
      - '57700:7700'
    tmpfs:
      - /meili_data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:7700/health']
      interval: 2s
      timeout: 3s
      retries: 30

  # The invitation email has to go somewhere the suite can read it back; Mailpit's REST
  # API on 58025 is how the e2e specs assert that a message actually left the API.
  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
      # Messages live in memory only, like every other service in this project.
      MP_MAX_MESSAGES: '500'
    ports:
      - '51025:1025'
      - '58025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 2s
      timeout: 3s
      retries: 30

name: beacon

# The dev stack, reachable from this machine only: every port binds to loopback so
# nothing here is published on the network. Credentials come from the environment and
# fall back to the well-known dev values below — set the overrides before bringing the
# stack up on a machine you do not control.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-beacon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beacon}
      POSTGRES_DB: ${POSTGRES_DB:-beacon}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-beacon}']
      interval: 10s
      timeout: 5s
      retries: 5

  # Default object storage. Swap for S3/GCS by pointing STORAGE_* at another endpoint.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-beacon}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-beacon-secret}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  # Development mail sink. Accepts every message on 1025 and delivers none — read them
  # in the web UI on http://localhost:8025. Point MAIL_* at a real relay in production.
  mailpit:
    image: axllent/mailpit:v1.31.0
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      timeout: 5s
      retries: 5

  # Search over documents and people. Bundled self-hosted default; point SEARCH_* at
  # another engine, or leave SEARCH_HOST empty and Beacon runs without search at all.
  meilisearch:
    image: getmeili/meilisearch:v1.13
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-beacon-search-key}
      MEILI_ENV: development
    ports:
      - '127.0.0.1:7700:7700'
    volumes:
      - meilisearch-data:/meili_data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:7700/health']
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  loki:
    image: grafana/loki:3.7.7
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - '127.0.0.1:3100:3100'
    volumes:
      - loki-data:/loki

  alloy:
    image: grafana/alloy:v1.19.2
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    ports:
      - '127.0.0.1:12345:12345'
    volumes:
      - ./observability/config.alloy:/etc/alloy/config.alloy:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:13.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
    ports:
      - '127.0.0.1:3001:3000'
    volumes:
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

volumes:
  postgres-data:
  minio-data:
  meilisearch-data:
  prometheus-data:
  loki-data:
  grafana-data:

# Packaging. Not run in CI: each target needs its own runner, and the four repo checks
# (build, lint, typecheck, test) all pass without ever launching Electron. Build a
# release with `pnpm --filter desktop dist` on the platform you are releasing for.
appId: com.beacon.desktop
productName: Beacon
copyright: Beacon

directories:
  output: release
  buildResources: assets

files:
  - dist/**/*
  - assets/**/*
  - package.json

# pnpm's store is symlinked, which electron-builder cannot follow into a package.
nodeGypRebuild: false

# Lets an administrator hand out a beacon://connect?url=… link instead of the address
# itself. On Linux this needs the desktop entry's MimeType spelled out explicitly —
# electron-builder's own coverage of this key is strongest on mac and NSIS — so check
# the packaged .desktop file carries `MimeType=x-scheme-handler/beacon;` when releasing.
protocols:
  - name: Beacon
    schemes: [beacon]

mac:
  category: public.app-category.productivity
  icon: assets/icon.png
  target: [dmg, zip]
  # Time tracking should not need a Dock icon in the way — the tray is the surface.
  extendInfo:
    LSUIElement: false

win:
  icon: assets/icon.png
  target: [nsis]

linux:
  icon: assets/icon.png
  category: Office
  target: [AppImage, deb]

<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>Beacon</title>
<style>
  /* Deliberately plain and self-contained. This is the only screen the desktop app
     draws itself — everything after it is the web app, with the real design system. */
  :root { color-scheme: light dark; --ink: #16181d; --muted: #5c6370; --line: #d6dae1; --bg: #f7f8fa; --field: #ffffff; --accent: #2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #eceef2; --muted: #9aa1ad; --line: #343a45; --bg: #16181d; --field: #1e2229; --accent: #6a9bff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem;
         background: var(--bg); color: var(--ink);
         font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width: 100%; max-width: 22rem; }
  h1 { margin: 0 0 .35rem; font-size: 1.15rem; }
  p { margin: 0 0 1.25rem; color: var(--muted); }
  label { display: block; margin-bottom: .35rem; font-weight: 600; }
  input { width: 100%; padding: .55rem .7rem; border: 1px solid var(--line); border-radius: .5rem;
          background: var(--field); color: inherit; font: inherit; }
  input:disabled, input:read-only { opacity: .65; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .actions { display: flex; gap: .5rem; margin-top: 1rem; }
  button { flex: 1; padding: .55rem .9rem; border: 1px solid transparent; border-radius: .5rem;
           background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  button.secondary { background: transparent; border-color: var(--line); color: inherit; }
  [role="status"] { margin: .5rem 0 0; color: var(--muted); min-height: 1.2em; font-size: .9em; }
  [role="alert"] { margin-top: .3rem; color: #c0392b; min-height: 1.4em; }
  @media (prefers-color-scheme: dark) { [role="alert"] { color: #ff8f83; } }
</style>

<main>
  <h1 id="title"></h1>
  <p id="intro"></p>
  <form id="form">
    <label for="url" id="label"></label>
    <input id="url" name="url" type="text" inputmode="url" autocomplete="url"
           autocapitalize="none" spellcheck="false"
           placeholder="beacon.example.com" aria-describedby="status message" required />
    <p id="status" role="status" aria-live="polite"></p>
    <p id="message" role="alert"></p>
    <div class="actions">
      <button type="submit" id="submit"></button>
      <button type="button" id="secondary" class="secondary" hidden></button>
    </div>
  </form>
</main>

<script>
  const form = document.getElementById('form');
  const field = document.getElementById('url');
  const status = document.getElementById('status');
  const message = document.getElementById('message');
  const secondary = document.getElementById('secondary');
  const submitButton = document.getElementById('submit');

  let copy = null;
  // Set once a probe reports the instance still needs installing: the next submit of
  // the same address is a deliberate "continue anyway" rather than a retry.
  let pendingConfirm = false;

  async function render() {
    copy = await window.beaconSetup.copy();

    document.documentElement.lang = copy.language;
    document.title = copy.title;
    document.getElementById('title').textContent = copy.title;
    document.getElementById('intro').textContent = copy.intro;
    document.getElementById('label').textContent = copy.label;
    submitButton.textContent = copy.submit;
    field.value = copy.url ?? '';

    if (copy.locked) {
      // Nothing to type: the address is enforced by the organization. Only a retry —
      // for a provisioned address that is temporarily unreachable — stays available.
      field.readOnly = true;
      submitButton.hidden = true;
    }

    if (copy.retry) {
      secondary.hidden = false;
      secondary.textContent = copy.retry;
      secondary.onclick = () => window.beaconSetup.retry();
    }

    if (!copy.locked) {
      field.focus();
      field.select();
    }
  }

  field.addEventListener('input', () => {
    // A changed address is a new attempt, not a continuation of the last one.
    if (!pendingConfirm) return;
    pendingConfirm = false;
    if (copy) submitButton.textContent = copy.submit;
  });

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    if (copy && copy.locked) return;

    message.textContent = '';
    status.textContent = copy ? copy.checking : '';
    field.disabled = true;
    submitButton.disabled = true;
    form.setAttribute('aria-busy', 'true');

    let result;
    try {
      result = await window.beaconSetup.submit(field.value.trim(), pendingConfirm);
    } finally {
      field.disabled = false;
      submitButton.disabled = false;
      form.removeAttribute('aria-busy');
      status.textContent = '';
    }

    if (result.ok) return; // the main process adopts the address and relaunches

    message.textContent = result.message;
    pendingConfirm = Boolean(result.confirm);
    if (copy) submitButton.textContent = pendingConfirm ? copy.confirm : copy.submit;

    field.focus();
  });

  render();
</script>

# Static host for the SPA. `apps/web` is client-only — adapter-static emits an
# index.html fallback and every route is resolved in the browser, so this server does
# exactly two things: serve hashed assets, and hand index.html to everything else.
server {
    # The unprivileged nginx image runs as uid 101 and cannot bind 80.
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Traefik terminates TLS and is the only thing that talks to this port.
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # No CSP here: SvelteKit's generated index.html carries an inline module script,
    # so a `default-src 'none'` policy of the kind the API sends would blank the page.
    # The API sets its own headers on its own responses; these cover the shell.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Everything under _app is content-hashed by Vite, so it is immutable.
    location /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Written at container start from PUBLIC_API_URL — caching it would pin a browser
    # to the address of a previous deployment.
    location = /_app/env.js {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # The shell must never be cached: a redeploy changes which hashed bundles it
    # points at, and a stale index.html asks for files that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
